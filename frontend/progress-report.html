<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>📊 Progress Report - MindMitra</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{font-family:'Poppins',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f5f7fb;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto 16px;background:#fff;padding:14px 20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.top a{text-decoration:none;color:#667eea;font-weight:600;font-size:13px}
.helpline{background:#fff3cd;border-left:4px solid #f0a500;padding:10px 14px;border-radius:8px;max-width:1100px;margin:0 auto 16px;font-size:11px;color:#664d03}
.stats{max-width:1100px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:#fff;border-radius:14px;padding:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.stat span{font-size:11px;color:#777;display:block}.stat b{font-size:22px;color:#333}
.stat.green b{color:#28a745}.stat.purple b{color:#667eea}.stat.orange b{color:#fd7e14}.stat.red b{color:#dc3545}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
.card h4{font-size:14px;margin-bottom:12px}
.history-item{padding:10px 0;border-bottom:1px solid #f0f0f0;display:flex;gap:10px;align-items:center}
.emoji-big{font-size:26px;width:42px;height:42px;background:#f5f7fb;border-radius:50%;display:flex;align-items:center;justify-content:center}
.meta{flex:1}.meta b{font-size:13px}.meta p{font-size:11px;color:#777}
.badge{font-size:10px;padding:3px 8px;border-radius:10px;background:#eef0ff;color:#667eea}
@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
<a href="dashboard.html">← Dashboard</a>
<h3 style="font-size:15px">📊 Progress Report (SQL)</h3>
<a href="mood-tracker.html">Track Mood →</a>
</div>
<div class="helpline">⚠️ This report is for self-awareness only. Helpline: <b>1800-599-0019</b> | Data from  moods </div>
<div class="stats">
<div class="stat purple"><span>😁 Total Moods</span><b id="total">0</b></div>
<div class="stat green"><span>😊 Avg Intensity</span><b id="avg">0</b></div>
<div class="stat orange"><span>📷 Face Scans</span><b id="scans">0</b></div>
<div class="stat red"><span>😔 Low Days (≤3)</span><b id="low">0</b></div>
</div>
<div class="grid">
<div class="card"><h4>📈 Mood Trend - Last 7 Entries</h4><canvas id="lineChart" style="max-height:240px"></canvas></div>
<div class="card"><h4>🥧 Mood Distribution</h4><canvas id="pieChart" style="max-height:240px"></canvas></div>
</div>
<div class="card" style="max-width:1100px;margin:16px auto 0">
<h4>📜 Recent History (Latest First) </h4>
<div id="hist" style="margin-top:8px"></div>
</div>
<script>
let email = localStorage.getItem('mm_userEmail') || 'demo@mind.com';
async function loadReport(){
 let allRaw = JSON.parse(localStorage.getItem('mm_moods')||'[]');
 let all = allRaw.filter(m =>!m.email || m.email === email || m.email === 'demo');
 // Try SQL
 try{
  let res = await fetch('http://localhost:3000/api/moods/'+email);
  let sqlData = await res.json();
  if(sqlData && sqlData.length>0){
   all = sqlData.map(r=>({
     mood:r.mood, emoji:r.emoji||'😐', intensity:r.intensity||5,
     dateStr: r.dateStr||new Date(r.created_at).toLocaleDateString(),
     note:r.note||'', activities:r.activities?r.activities.split(','):[], source:r.source||'',
     time: new Date(r.created_at).toLocaleTimeString()
   }));
  }
 }catch(e){ console.log('Using local', e); }

 if(all.length===0){
  all = [{mood:'Happy',emoji:'😊',intensity:8,dateStr:'Today',note:'Demo - Start tracking to see real data',activities:['Study']}];
 }

 document.getElementById('total').innerText = all.length;
 let avgVal = all.length? (all.reduce((s,m)=>s+parseInt(m.intensity||5),0)/all.length).toFixed(1) : 0;
 document.getElementById('avg').innerText = avgVal + '/10';
 document.getElementById('scans').innerText = all.filter(m=> (m.activities && m.activities.join('').includes('Face')) || m.source==='face' || m.activities.join('').includes('face-detection')).length;
 document.getElementById('low').innerText = all.filter(m=>parseInt(m.intensity)<=3).length;

 let histDiv = document.getElementById('hist');
 let display = [...all].reverse().slice(0,15);
 histDiv.innerHTML = display.map(m=>`
  <div class="history-item">
    <div class="emoji-big">${m.emoji||'😐'}</div>
    <div class="meta">
      <b>${m.mood || 'Mood'} <span class="badge">${m.intensity}/10</span></b>
      <p>${m.dateStr || ''} • ${m.note||'No note'} • ${m.activities? m.activities.join(', ') : ''}</p>
    </div>
    <div style="font-size:11px;color:#999">${m.time||''}</div>
  </div>
 `).join('') || '<p style="text-align:center;color:#999;padding:20px">No data yet</p>';

 let last7 = [...all].slice(-7);
 new Chart(document.getElementById('lineChart'),{
  type:'line',
  data:{
    labels: last7.map(m=> `${m.emoji||'😐'} ${m.dateStr||''}`),
    datasets:[{label:'Intensity',data: last7.map(m=>m.intensity),borderColor:'#667eea',backgroundColor:'rgba(102,126,234,0.15)',fill:true,tension:0.4,borderWidth:2,pointRadius:5,pointBackgroundColor:'#764ba2'}]
  },
  options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{min:0,max:10}}}
 });
 let counts={};
 all.forEach(m=>{ let key = `${m.emoji||'😐'} ${m.mood||'Unknown'}`; counts[key]=(counts[key]||0)+1; });
 new Chart(document.getElementById('pieChart'),{
  type:'doughnut',
  data:{labels: Object.keys(counts),datasets:[{data: Object.values(counts),backgroundColor:['#667eea','#764ba2','#f093fb','#4facfe','#43e97b','#fa709a','#f6d365','#a8edea'],borderWidth:0}]},
  options:{responsive:true,plugins:{legend:{position:'bottom',labels:{font:{size:11},padding:12}}}}
 });
}
loadReport();
</script>
</body>
</html>

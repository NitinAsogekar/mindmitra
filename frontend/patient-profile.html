<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Patient Profile - MindMitra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f5f7fb;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:0 auto 20px;background:#fff;padding:14px 20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.05)}
.top a{text-decoration:none;color:#667eea;font-weight:600;font-size:14px}
.container{max-width:900px;margin:0 auto;display:grid;grid-template-columns:300px 1fr;gap:20px}
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.06)}
.profile{text-align:center}
.avatar{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.stat{background:#f8f9ff;padding:10px;border-radius:10px;text-align:center}
.stat b{display:block;font-size:18px;color:#667eea}
.stat span{font-size:11px;color:#666}
label{font-size:12px;color:#666;font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid #e8e8ec;border-radius:8px;margin:6px 0 12px;outline:none;font-size:13px}
input:focus,textarea:focus{border-color:#667eea}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-outline{background:#fff;color:#667eea;border:1.5px solid #667eea}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;background:#eef0ff;color:#667eea;margin:3px}
h4{margin-bottom:12px}
@media(max-width:768px){.container{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="top">
<a href="dashboard.html">← Dashboard</a>
<h3 style="font-size:15px">My Profile 👤</h3>
<a href="progress-report.html">View Report →</a>
</div>
<div class="container">
<div class="card profile">
<div class="avatar" id="avatarTxt">M</div>
<h3 id="pName">MindMitra User</h3>
<p id="pEmail" style="font-size:12px;color:#666;margin-top:4px">demo@mind.com</p>
<div style="margin-top:10px">
<span class="badge" id="bMood">Mood: --</span>
<span class="badge" id="bJournal">Journals: 0</span>
</div>
<div class="stat-grid">
<div class="stat"><b id="sMood">0</b><span>Total Moods</span></div>
<div class="stat"><b id="sJournal">0</b><span>Journals</span></div>
<div class="stat"><b id="sAssess">0</b><span>Assessments</span></div>
<div class="stat"><b id="sAppt">0</b><span>Appointments</span></div>
</div>
<button class="btn btn-outline" style="margin-top:20px" onclick="clearData()">Clear My Data</button>
<button class="btn btn-outline" onclick="logout()">Logout</button>
</div>
<div class="card">
<h4>Personal Information</h4>
<label>Full Name</label>
<input id="fullName" placeholder="Enter your full name">
<label>Email</label>
<input id="email" disabled>
<label>Phone</label>
<input id="phone" placeholder="Enter phone">
<label>Age</label>
<input id="age" type="number" placeholder="e.g. 21">
<label>Gender</label>
<select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select>
<label>College / Organization</label>
<input id="college" placeholder="e.g. Govt Engineering College">
<label>Emergency Contact Name</label>
<input id="emergencyName" placeholder="Family / Friend">
<label>Emergency Contact Number</label>
<input id="emergencyPhone" placeholder="Emergency number">
<label>About Me</label>
<textarea id="about" rows="3" placeholder="Share briefly..."></textarea>
<label>Current Concerns</label>
<input id="concerns" placeholder="e.g. Stress, Sleep, Anxiety">
<button class="btn" onclick="saveProfile()">Save Profile 💾 </button>
<p id="msg" style="font-size:12px;text-align:center;margin-top:10px;color:green"></p>
</div>
</div>
<script>
let email = localStorage.getItem('mm_userEmail') || 'demo@mind.com';
document.getElementById('email').value = email;
document.getElementById('pEmail').textContent = email;
async function loadProfile(){
 let key = 'mm_profile_'+email;
 let data = JSON.parse(localStorage.getItem(key) || '{}');
 try{
  let res = await fetch('http://localhost:3000/api/profile/'+email);
  let sql = await res.json();
  if(sql && sql.email) data = {...data,...sql, fullName: sql.name||data.fullName, about: sql.bio||data.about};
 }catch(e){}
 document.getElementById('fullName').value = data.fullName||data.name||'';
 document.getElementById('phone').value = data.phone||'';
 document.getElementById('age').value = data.age||'';
 document.getElementById('gender').value = data.gender||'';
 document.getElementById('college').value = data.college||'';
 document.getElementById('emergencyName').value = data.emergencyName||'';
 document.getElementById('emergencyPhone').value = data.emergencyPhone||'';
 document.getElementById('about').value = data.about||data.bio||'';
 document.getElementById('concerns').value = data.concerns||'';
 let name = data.fullName||data.name||email.split('@')[0];
 document.getElementById('pName').textContent = name;
 document.getElementById('avatarTxt').textContent = name.charAt(0).toUpperCase();
 localStorage.setItem('mm_userName', name);
 try{
  let moods = await fetch('http://localhost:3000/api/moods/'+email).then(r=>r.json()).catch(()=>[]);
  let journals = await fetch('http://localhost:3000/api/journals/'+email).then(r=>r.json()).catch(()=>[]);
  document.getElementById('sMood').textContent = moods.length;
  document.getElementById('sJournal').textContent = journals.length;
  document.getElementById('bMood').textContent = 'Mood: '+moods.length;
  document.getElementById('bJournal').textContent = 'Journals: '+journals.length;
 }catch(e){
  let moods = JSON.parse(localStorage.getItem('mm_moods')||'[]').length;
  let journals = JSON.parse(localStorage.getItem('mm_journals')||'[]').length;
  document.getElementById('sMood').textContent = moods;
  document.getElementById('sJournal').textContent = journals;
 }
}
async function saveProfile(){
 let data = {
  fullName: document.getElementById('fullName').value,
  name: document.getElementById('fullName').value,
  email: email,
  phone: document.getElementById('phone').value,
  age: document.getElementById('age').value,
  gender: document.getElementById('gender').value,
  college: document.getElementById('college').value,
  bio: document.getElementById('about').value,
  about: document.getElementById('about').value,
  concerns: document.getElementById('concerns').value,
  emergencyName: document.getElementById('emergencyName').value,
  emergencyPhone: document.getElementById('emergencyPhone').value
 };
 localStorage.setItem('mm_profile_'+email, JSON.stringify(data));
 localStorage.setItem('mm_userName', data.fullName);
 try{
  let res = await fetch('http://localhost:3000/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  let r = await res.json();
  document.getElementById('msg').textContent = r.success?'✅ Saved to profile ':'Saved locally!';
 }catch(e){ document.getElementById('msg').textContent='✅ Saved locally! Start node index.js for SQL'; }
 loadProfile();
}
function clearData(){ if(confirm('Delete local data?')){ localStorage.clear(); alert('Cleared'); loadProfile(); } }
function logout(){ localStorage.removeItem('mm_currentUser'); location.href='index.html'; }
loadProfile();
</script>
</body>
</html>

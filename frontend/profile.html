<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Profile - MindMitra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>
localStorage.removeItem('mm_theme');
document.documentElement.removeAttribute('data-theme');
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
html,body{background:#f5f7fb !important;color:#222 !important;min-height:100vh}
body{padding:20px}
.navbar{max-width:1100px;margin:0 auto 20px;background:#fff !important;padding:12px 18px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;position:sticky;top:10px;z-index:50}
.nav-logo{font-weight:700;color:#667eea;cursor:pointer;font-size:15px}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links a{text-decoration:none;color:#555;font-size:12px;padding:6px 10px;border-radius:20px}
.nav-links a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff !important}
.menu-btn{display:none;border:none;background:none;font-size:18px;cursor:pointer}
@media(max-width:900px){.nav-links{display:none;position:absolute;top:60px;left:20px;right:20px;background:#fff !important;padding:12px;border-radius:12px;flex-direction:column;box-shadow:0 10px 25px rgba(0,0,0,.1)}.nav-links.open{display:flex}.menu-btn{display:block}}
.wrap{max-width:800px;margin:0 auto}
.card{background:#fff !important;border-radius:18px;padding:24px;box-shadow:0 8px 25px rgba(0,0,0,.05);margin-bottom:18px}
.avatar-big{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 12px}
.center{text-align:center}
.h{font-size:16px;font-weight:600;margin-bottom:14px}
.row{display:flex;gap:12px;margin-bottom:12px}
.row div{flex:1}
label{font-size:11px;color:#777;display:block;margin-bottom:4px}
input{width:100%;padding:11px;border:1.5px solid #e8e8ec;border-radius:10px;outline:none;font-size:13px;background:#fff !important;color:#222 !important}
input:focus{border-color:#667eea}
.btn{padding:11px 18px;border:none;border-radius:10px;font-weight:600;cursor:pointer;font-size:13px}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;width:100%;margin-top:10px}
.btn-outline{background:#f5f7fb;color:#555}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.stat{text-align:center;padding:14px;background:#f9f9ff;border-radius:12px}
.stat b{font-size:22px;display:block;color:#667eea}
.stat span{font-size:11px;color:#777}
.danger{color:#e74c3c !important;font-size:12px;cursor:pointer;text-align:center;margin-top:12px;display:block;background:none;border:none;width:100%}
</style>
</head>
<body>
<div class="navbar">
  <div class="nav-logo" onclick="location.href='dashboard.html'">🧠 MindMitra</div>
  <div class="nav-links" id="navLinks">
    <a href="dashboard.html">🏠 Dashboard</a>
    <a href="mood-tracker.html">😊 Mood</a>
    <a href="face-detection.html">📷 Face Scan</a>
    <a href="progress-report.html">📊 Progress</a>
    <a href="journal.html">📔 Journal</a>
    <a href="therapist.html">👩‍⚕️ Therapist</a>
    <a href="community.html">💬 Community</a>
    <a href="profile.html" class="active">👤 Profile</a>
  </div>
  <button class="menu-btn" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
</div>
<div class="wrap">
<div class="card center">
<div class="avatar-big" id="avatar">U</div>
<h2 id="pName" style="font-size:18px">Demo User</h2>
<p id="pEmail" style="font-size:12px;color:#777">demo@mind.com</p>
<div class="stats">
<div class="stat"><b id="sMood">0</b><span>Moods Tracked</span></div>
<div class="stat"><b id="sJourn">0</b><span>Journal Entries</span></div>
<div class="stat"><b id="sAppt">0</b><span>Appointments</span></div>
</div>
</div>
<div class="card">
<div class="h">Edit Profile ✏️</div>
<div class="row">
<div><label>Full Name</label><input id="editName" placeholder="Your name"></div>
<div><label>Email</label><input id="editEmail" disabled style="background:#f5f7fb !important"></div>
</div>
<label>College / Year (optional)</label>
<input id="editCollege" placeholder="Ex: STJ Shimoga, 3rd Year CSE" style="margin-bottom:10px">
<label>Bio / What you want help with?</label>
<input id="editBio" placeholder="Ex: Exam stress, placement anxiety...">
<button class="btn btn-primary" onclick="saveProfile()">Save Changes 💾 (SQL)</button>
</div>
<div class="card">
<div class="h">Settings ⚙️</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f0f0f0">
<span style="font-size:13px">🔒 Private Mode (Anonymous in Community)</span><input type="checkbox" checked style="width:auto">
</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0">
<span style="font-size:13px">🔔 Daily Mood Reminder (9 PM)</span><input type="checkbox" id="remind" style="width:auto">
</div>
<button class="btn btn-outline" style="width:100%;margin-top:12px" onclick="clearData()">🗑️ Clear My Data (Local)</button>
<button class="danger" onclick="logout()">Log Out →</button>
</div>
</div>
<script>
async function load(){
 let user = JSON.parse(localStorage.getItem('mm_currentUser')||'null') || {username:'Demo User',email:'demo@mind.com'};
 let email = localStorage.getItem('mm_userEmail') || user.email || 'demo@mind.com';
 let name = localStorage.getItem('mm_userName') || user.username || 'Demo User';
 // Try SQL
 try{
  let res = await fetch('http://localhost:3000/api/profile/'+email);
  let sql = await res.json();
  if(sql && sql.email){ name = sql.name||name; }
 }catch(e){}
 document.getElementById('pName').innerText = name;
 document.getElementById('pEmail').innerText = email;
 document.getElementById('editName').value = name;
 document.getElementById('editEmail').value = email;
 document.getElementById('editCollege').value = localStorage.getItem('mm_college')||'';
 document.getElementById('editBio').value = localStorage.getItem('mm_bio')||'';
 document.getElementById('avatar').innerText = name.charAt(0).toUpperCase();
 try{
  let moods = await fetch('http://localhost:3000/api/moods/'+email).then(r=>r.json()).catch(()=>[]);
  let journals = await fetch('http://localhost:3000/api/journals/'+email).then(r=>r.json()).catch(()=>[]);
  document.getElementById('sMood').innerText = moods.length || JSON.parse(localStorage.getItem('mm_moods')||'[]').length;
  document.getElementById('sJourn').innerText = journals.length || JSON.parse(localStorage.getItem('mm_journals')||'[]').length;
 }catch(e){
  document.getElementById('sMood').innerText = JSON.parse(localStorage.getItem('mm_moods')||'[]').length;
  document.getElementById('sJourn').innerText = JSON.parse(localStorage.getItem('mm_journals')||'[]').length;
 }
 document.getElementById('sAppt').innerText = JSON.parse(localStorage.getItem('mm_appointments')||'[]').length;
}
async function saveProfile(){
 let n=document.getElementById('editName').value.trim();
 if(n.length<2){alert('Enter valid name');return;}
 let email = document.getElementById('editEmail').value;
 let college = document.getElementById('editCollege').value;
 let bio = document.getElementById('editBio').value;
 localStorage.setItem('mm_userName',n);
 localStorage.setItem('username',n);
 localStorage.setItem('mm_college',college);
 localStorage.setItem('mm_bio',bio);
 let user=JSON.parse(localStorage.getItem('mm_currentUser')||'{}');
 user.username=n; user.email=email;
 localStorage.setItem('mm_currentUser',JSON.stringify(user));
 try{
  await fetch('http://localhost:3000/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email, name:n, college:college, bio:bio})});
  alert('✅ Profile saved to  users ');
 }catch(e){ alert('Profile saved locally ✅ (Run node index.js for SQL)'); }
 load();
}
function clearData(){
 if(confirm('Delete all moods, journals locally?')){
  localStorage.removeItem('mm_moods');
  localStorage.removeItem('mm_journals');
  localStorage.removeItem('mm_community_posts');
  alert('Cleared ✅'); load();
 }
}
function logout(){ if(confirm('Logout?')){ localStorage.removeItem('mm_currentUser'); location.href='index.html'; } }
load();
</script>
</body>
</html>

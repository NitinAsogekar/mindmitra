<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daily Journal - MindMitra</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#fdf8f0;min-height:100vh;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center;max-width:800px;margin:0 auto 20px}
.top a{text-decoration:none;color:#667eea;font-weight:600}
.wrap{max-width:800px;margin:0 auto;display:flex;gap:20px}
.left{flex:1.2}
.right{flex:0.8}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.05);margin-bottom:18px}
.h{font-size:18px;font-weight:600;margin-bottom:12px}
textarea{width:100%;min-height:140px;padding:14px;border:1.5px solid #f0e6d8;border-radius:14px;outline:none;resize:none;font-size:14px;line-height:1.6;background:#fffcf7}
textarea:focus{border-color:#ffb86a}
.prompts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.p{padding:6px 12px;background:#fff3e0;border-radius:20px;font-size:12px;cursor:pointer;border:1px solid #ffe0b2}
.p:hover{background:#ffcc80}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#ff9a56,#ff6a3d);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer;margin-top:12px}
.entry{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;border-left:4px solid #ffb86a}
.entry .date{font-size:16px;color:#999;font-family:Caveat}
.entry .text{font-size:13px;margin-top:6px;line-height:1.5;color:#444;white-space:pre-wrap}
.mood-row{display:flex;gap:8px;margin:10px 0}
.m{font-size:22px;cursor:pointer;opacity:.4;transition:.2s}
.m.selected{opacity:1;transform:scale(1.3)}
@media(max-width:700px){.wrap{flex-direction:column}}
</style>
</head>
<body>
<div class="top">
<a href="dashboard.html">← Dashboard</a>
<span style="font-weight:600">Daily Journal 📔</span>
<a href="progress-report.html">Report →</a>
</div>

<div class="wrap">
<div class="left">
<div class="card">
<div class="h">How are you feeling today?</div>
<div class="mood-row">
<span class="m" onclick="pickMood(this,'happy')">😊</span>
<span class="m" onclick="pickMood(this,'calm')">😌</span>
<span class="m" onclick="pickMood(this,'sad')">😔</span>
<span class="m" onclick="pickMood(this,'angry')">😠</span>
<span class="m" onclick="pickMood(this,'anxious')">😰</span>
<span class="m" onclick="pickMood(this,'tired')">😴</span>
</div>
<div class="prompts">
<div class="p" onclick="usePrompt('Today I am grateful for...')">Grateful for...</div>
<div class="p" onclick="usePrompt('The best part of today was...')">Best part...</div>
<div class="p" onclick="usePrompt('I am worried about...')">Worried...</div>
<div class="p" onclick="usePrompt('Tomorrow I want to...')">Tomorrow...</div>
</div>
<textarea id="journalText" placeholder="Write freely... No one will judge. What's on your mind today?"></textarea>
<button class="btn" onclick="saveJournal()">Save Entry & Get AI Insight ✨</button>
<div id="aiBox" style="display:none;margin-top:15px;padding:12px;background:#f3e8ff;border-radius:12px;font-size:13px;color:#6a4fb5"></div>
</div>
</div>

<div class="right">
<div class="card">
<div class="h">Past Entries</div>
<div id="list"></div>
</div>
<div class="card" style="background:linear-gradient(135deg,#667eea,#764ba2);color:#fff">
<div style="font-size:14px;font-weight:600">🔒 Private & Safe</div>
<div style="font-size:12px;opacity:.9;margin-top:6px;line-height:1.5">Your journal is encrypted, stored only for you. Not shared with community or therapists unless you choose.</div>
</div>
</div>
</div>

<script>
let selectedMood='';
function pickMood(el,mood){ document.querySelectorAll('.m').forEach(e=>e.classList.remove('selected')); el.classList.add('selected'); selectedMood=mood; }
function usePrompt(t){ document.getElementById('journalText').value+= (document.getElementById('journalText').value ? '\n\n' : '') + t + ' '; document.getElementById('journalText').focus(); }

async function saveJournal(){
 let text=document.getElementById('journalText').value.trim();
 if(text.length<10){alert('Write at least 10 characters');return;}
 let email=localStorage.getItem('mm_userEmail')||localStorage.getItem('username')||'demo@mind.com';
 let entry={ id:Date.now(), userEmail:email, text:text, mood:selectedMood||'neutral', date:new Date().toLocaleDateString(), timestamp:new Date().toISOString() };
 let all=JSON.parse(localStorage.getItem('mm_journals')||'[]'); all.unshift(entry); localStorage.setItem('mm_journals',JSON.stringify(all));
 let sqlPayload = { email: email, title: "Journal " + new Date().toLocaleDateString(), content: text, mood: selectedMood||'neutral' };
 try{
  await fetch('http://localhost:3000/api/journal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sqlPayload)});
 }catch(e){}
 let aiBox=document.getElementById('aiBox'); aiBox.style.display='block';
 let insights=["🌿 It sounds like you had mixed emotions today. Acknowledging them is a big step. Try 5 mins breathing.","💙 You mentioned gratitude - that's powerful for mental wellness. Keep it up!","✨ I notice worry words. Remember to be kind to yourself. Would a short meditation help?","🌟 Great reflection! Your self-awareness is improving day by day."];
 aiBox.innerText=insights[Math.floor(Math.random()*insights.length)] + "\n\n✅ Saved journals ";
 document.getElementById('journalText').value=''; document.querySelectorAll('.m').forEach(e=>e.classList.remove('selected')); selectedMood=''; render();
}

async function render(){
 let email = localStorage.getItem('mm_userEmail')||'demo@mind.com';
 try{
  let res = await fetch('http://localhost:3000/api/journals/'+email);
  let data = await res.json();
  if(data && data.length>0){
   let html = ''; data.slice(0,10).forEach(e=>{ html+=`<div class="entry"><div class="date">${new Date(e.created_at).toLocaleDateString()} - ${e.mood}</div><div class="text">${e.content.substring(0,120)}${e.content.length>120?'...':''}</div></div>`; });
   document.getElementById('list').innerHTML=html; return;
  }
 }catch(e){}
 let all=JSON.parse(localStorage.getItem('mm_journals')||'[]');
 let html=''; if(all.length==0) html='<p style="font-size:12px;color:#999">No entries yet. Start writing today!</p>';
 else all.slice(0,10).forEach(e=>{ html+=`<div class="entry"><div class="date">${e.date} - ${e.mood}</div><div class="text">${e.text.substring(0,120)}${e.text.length>120?'...':''}</div></div>`; });
 document.getElementById('list').innerHTML=html;
}
render();
</script>
</body>
</html>
